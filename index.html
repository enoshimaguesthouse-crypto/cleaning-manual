async function pagePlaces(id, facId){
  const frame = id
    ? { title: id === 'new' ? '部屋・場所を追加' : '部屋・場所を編集', sub: '部屋・場所の管理', back: 'admin/places', noHome: true, admin: true }
    : { title: '部屋・場所の管理', sub: 'マニュアル管理', back: 'admin/manuals', noHome: true, admin: true };
  const r = await adminLoad('manualAdminList', frame);
  if (!r) return;
  const facs = r.facilities.filter(f => f.active);
  if (!manFilter || !facs.some(f => f.id === manFilter)) manFilter = (facs[0] || {}).id || '';
  if (!id){
    const count = pid => r.manuals.filter(m => m.status !== '削除済' && m.placeId === pid).length;
    const chip = f => '<button type="button" class="fchip' + (manFilter === f.id ? ' on' : '') + '" data-pf2="' + esc(f.id) + '">' + esc(f.name) + '</button>';
    const list = r.places.filter(p => p.facilityId === manFilter);
    const html = '<div class="fchips">' + facs.map(chip).join('') + '</div>' +
      '<a class="btn primary add" href="#/admin/places/new/' + encodeURIComponent(manFilter) + '">＋ 部屋・場所を追加</a>' +
      '<p class="hint" style="margin:8px 4px">トイレや共用部など、どの部屋にも当てはまらない作業は「施設共通」として登録できるため、ここに追加する必要はありません。</p>' +
      (list.length ? '<div class="list">' + list.map(p => '<a class="row" href="#/admin/places/' + encodeURIComponent(p.id) + '"' + (p.active ? '' : ' style="opacity:.6"') + '><span class="ic">🚪</span><span class="tx"><b>' + esc(p.name) + '</b><small>' +
        (p.active ? 'マニュアル ' + count(p.id) + '件' : '使用停止中・スタッフ画面に表示されません') + '</small></span>' + CHEV + '</a>').join('') + '</div>'
        : '<div class="empty">この施設には部屋・場所がまだありません。</div>');
    return showView(Object.assign({}, frame, { html, after: () => {
      document.querySelectorAll('[data-pf2]').forEach(b => b.onclick = () => { manFilter = b.dataset.pf2; renderAdmin(); });
    }}));
  }
  const pl = id === 'new' ? { id: '', facilityId: facId || manFilter, name: '', active: true } : r.places.find(p => p.id === id);
  if (!pl) return showView(Object.assign({}, frame, { html: '<div class="empty">' + ERR_TEXT.not_found + '</div>' }));
  const fname = (r.facilities.find(f => f.id === pl.facilityId) || {}).name || '';
  const html = '<form class="card form" id="plForm" novalidate>' +
    '<p class="kv"><span>施設</span><b>' + esc(fname) + '</b></p>' +
    '<label class="fld"><span>部屋・場所の名前<i class="req">必須</i></span><input id="plName" maxlength="40" value="' + esc(pl.name) + '" placeholder="例：201号室、ドミトリー、2階シャワー室"></label>' +
    (pl.id ? '<label class="switch"><input type="checkbox" id="plActive"' + (pl.active ? ' checked' : '') + '><span class="sw"></span><span class="lb">この部屋・場所を使う' +
      '<small>オフにすると、この部屋とそのマニュアルがスタッフ画面に表示されなくなります。マニュアル自体は消えません。</small></span></label>' : '') +
    '<div class="msg err" id="plErr" hidden></div>' +
    '<div class="savebar"><button class="btn primary" id="plSave" type="submit">' + (pl.id ? '変更を保存' : '追加する') + '</button></div></form>';
  showView(Object.assign({}, frame, { html, after: () => {
    const f = $('#plForm'); trackDirty(f);
    if (!pl.id) setTimeout(() => $('#plName').focus(), 50);
    const rid = reqId();
    f.onsubmit = e => {
      e.preventDefault();
      const name = $('#plName').value.trim();
      if (!name){ const el = $('#plErr'); el.textContent = '名前を入力してください。'; el.hidden = false; return; }
      manFilter = pl.facilityId;
      submitForm($('#plSave'), $('#plErr'), 'savePlace', { id: pl.id, facilityId: pl.facilityId, name, active: pl.id ? $('#plActive').checked : true, reqId: rid }, 'admin/places')
        .then(() => load());
    };
  }}));
}

/* ---------- デモ用：マニュアル管理（GAS_URLが空のときだけ） ---------- */
function demoManuals(){
  if (!DEMO_DB.man){
    DEMO_DB.man = DEMO_DATA.manuals.map((m, i) => Object.assign(JSON.parse(JSON.stringify(m)), { status: '公開', sort: i + 1, deletedAt: 0, video: '', updatedAt: 1 }));
    DEMO_DB.places = DEMO_DATA.places.map(p => Object.assign({ active: true }, p));
  }
  return DEMO_DB.man;
}
function demoSync(){
  const act = new Set(DEMO_DB.places.filter(p => p.active).map(p => p.id));
  DEMO_DATA.places = DEMO_DB.places.filter(p => p.active).map(p => ({ id: p.id, facilityId: p.facilityId, name: p.name }));
  DEMO_DATA.manuals = demoManuals().filter(m => m.status === '公開' && (!m.placeId || act.has(m.placeId))).sort((a, b) => a.sort - b.sort)
    .map(m => Object.assign({}, m, { videoId: driveIdOf(m.video), steps: m.steps.map((s, i) => Object.assign({ no: i + 1 }, s)) }));
  DATA = DEMO_DATA;
}
function demoManualApi(action, p){
  const list = demoManuals();
  const facs = DEMO_DATA.facilities.map(f => ({ id: f.id, name: f.name, active: true }));
  if (action === 'manualAdminList') return { ok: true, facilities: facs, places: DEMO_DB.places.slice(), categories: DEMO_DATA.categories, restoreDays: 30,
    manuals: list.map(m => ({ id: m.id, title: m.title, facilityId: m.facilityId, placeId: m.placeId, categoryId: m.categoryId, status: m.status, sort: m.sort, steps: m.steps.length, hasVideo: !!m.video, updatedAt: m.updatedAt, deletedAt: m.deletedAt })).sort((a, b) => a.sort - b.sort) };
  if (action === 'manualGet'){ const m = list.find(x => x.id === p.id); return m ? { ok: true, manual: JSON.parse(JSON.stringify(m)) } : { ok: false, error: 'not_found' }; }
  if (action === 'uploadImage') return { ok: false, error: 'demo' };
  if (action === 'saveManual'){
    let m = p.id ? list.find(x => x.id === p.id) : null;
    if (!m){ m = { id: 'MAN-' + String(list.length + 1).padStart(3, '0'), sort: list.length + 1, deletedAt: 0 }; list.push(m); }
    Object.assign(m, { title: p.title, facilityId: p.facilityId, placeId: p.placeId, categoryId: p.categoryId, status: p.status, purpose: p.purpose, tools: p.tools,
      cautions: p.cautions, completion: p.completion, finalChecks: p.finalChecks, video: p.video, steps: p.steps, updatedAt: Date.now() });
    demoSync(); return { ok: true, id: m.id };
  }
  if (action === 'deleteManual' || action === 'restoreManual'){
    const m = list.find(x => x.id === p.id); if (!m) return { ok: false, error: 'not_found' };
    if (action === 'deleteManual'){ m.status = '削除済'; m.deletedAt = Date.now(); } else { m.status = '下書き'; m.deletedAt = 0; }
    demoSync(); return { ok: true };
  }
  if (action === 'reorderManuals'){
    const sorts = p.ids.map(id => list.find(x => x.id === id).sort).sort((a, b) => a - b);
    p.ids.forEach((id, i) => { list.find(x => x.id === id).sort = sorts[i]; });
    demoSync(); return { ok: true };
  }
  if (action === 'savePlace'){
    let pl = p.id ? DEMO_DB.places.find(x => x.id === p.id) : null;
    if (!pl){ pl = { id: 'PLC-' + String(DEMO_DB.places.length + 1).padStart(3, '0'), facilityId: p.facilityId }; DEMO_DB.places.push(pl); }
    Object.assign(pl, { name: p.name, active: p.active !== false });
    demoSync(); return { ok: true, id: pl.id };
  }
  return { ok: false, error: 'unknown_action' };
}

/* ---------- お知らせ（画面下に数秒表示） ---------- */
let toastTimer = null;
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

$('#homeBtn').onclick = () => go('');
// 画面移動。入力途中の内容があれば確認してから移動する
let lastHash = location.hash, revertingHash = false;
window.addEventListener('hashchange', () => {
  if (revertingHash){ revertingHash = false; return; }
  if (dirty && !confirm('保存していない入力内容があります。\n入力内容を破棄して移動しますか？')){
    revertingHash = true; location.hash = lastHash; return;
  }
  setDirty(false); lastHash = location.hash; render();
});
// アプリに戻ってきたとき（別アプリから切り替え）に最新を確認
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && GAS_URL) load(); });
if (isAdminRoute()) render();
load();
